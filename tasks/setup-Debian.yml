#   when: ansible_distribution == "Debian"
- block:
    - name: Add dependencies for PHP versions (Debian).
      ansible.builtin.apt:
        name: ['apt-transport-https','ca-certificates', 'gpg', 'python3-debian']

    # - name: Add Ondrej Sury's apt key (Debian).
    #   ansible.builtin.apt_key:
    #     url: https://packages.sury.org/debsuryorg-archive-keyring.deb
    #     state: present

    # - name: Add Ondrej Sury's repo (Debian).
    #   ansible.builtin.apt_repository:
    #     repo: "deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/ {{ ansible_distribution_release }} main"
    #     state: present
    #   register: php_ondrej_debian_repo

    - name: Download and dearmor Ondrej Sury PHP GPG key
      ansible.builtin.get_url:
        url: https://packages.sury.org/php/apt.gpg
        dest: /usr/share/keyrings/php-sury-keyring.gpg
        mode: '0644'
        force: true

    - name: Remove legacy Ondrej Sury PHP repository list file
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/php-sury.list
        state: absent

    - name: Add Ondrej Sury PHP repository
      ansible.builtin.deb822_repository:
        name: php-sury
        types: deb
        uris: "https://packages.sury.org/php/"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: /usr/share/keyrings/php-sury-keyring.gpg
        state: present
      register: php_ondrej_debian_repo


    - name: Update apt caches after repo is added (Debian).
      ansible.builtin.apt: update_cache=yes
      when: php_ondrej_debian_repo.changed
 
  when: ansible_facts['distribution'] == "Debian" and ansible_facts['distribution_release'] == "bookworm"
 

- name: Ensure PHP packages are installed.
  ansible.builtin.apt:
    name: "{{ php_packages + php_packages_extra }}"
    state: "{{ php_packages_state }}"
    install_recommends: "{{ php_install_recommends }}"
  register: php_package_install
  notify: restart webserver

- name: Delete APCu configuration file if this role will provide one.
  file:
    path: "{{ item }}/{{ php_apc_conf_filename }}"
    state: absent
  with_items: "{{ php_extension_conf_paths }}"
  when: php_enable_apc and php_package_install.changed
  notify: restart webserver

- name: Delete OpCache configuration file if this role will provide one.
  file:
    path: "{{ item }}/{{ php_opcache_conf_filename }}"
    state: absent
  with_items: "{{ php_extension_conf_paths }}"
  when: php_opcache_enable | bool and php_package_install.changed
  notify: restart webserver
